# .github/workflows/daily_leetcode.yml
#
# Runs every day automatically on GitHub's cloud servers (no local PC required).
# Multiple schedule triggers ensure that even if GitHub's shared queue is congested,
# today's daily problem is guaranteed to be solved before midnight.
# Once solved, all subsequent runs exit cleanly in 2 seconds.

name: Daily LeetCode Auto-Submit

on:
  schedule:
    # 15:30 UTC = 21:00 IST (9:00 PM IST target)
    - cron: "30 15 * * *"
    # 15:45 UTC = 21:15 IST (Off-peak backup to bypass :00 and :30 minute congestion)
    - cron: "45 15 * * *"
    # 16:05 UTC = 21:35 IST (Backup)
    - cron: "05 16 * * *"
    # 16:35 UTC = 22:05 IST (Backup)
    - cron: "35 16 * * *"
    # 17:05 UTC = 22:35 IST (Backup)
    - cron: "05 17 * * *"
    # 18:05 UTC = 23:35 IST (Safety net before midnight resets the challenge)
    - cron: "05 18 * * *"

  workflow_dispatch:
    inputs:
      force:
        description: 'Force solve & submit even if already completed today'
        required: false
        default: false
        type: boolean

jobs:
  solve-and-submit:
    name: Solve & Submit Daily Problem
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 4. Run the solver ─────────────────────────────────────────────────
      - name: Run daily solver
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          CSRF_TOKEN:       ${{ secrets.CSRF_TOKEN }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          EMAIL_FROM:       ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD:   ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          FORCE_RUN:        ${{ inputs.force || 'false' }}
        run: python scripts/solve_and_submit.py
